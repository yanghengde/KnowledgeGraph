apiVersion: batch/v1
kind: CronJob
metadata:
  name: camstar-graphstudio-sync
spec:
  schedule: "0 * * * *"
  timeZone: "Asia/Shanghai"
  # Remove this guard only after contracts, relationships and incremental
  # policies have passed UAT. The command still enforces every database gate.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: registry.example.com/camstar-ontology:latest
              imagePullPolicy: IfNotPresent
              # Pins the active ontology, freezes one incremental source window,
              # builds an immutable data release, switches the Graph Studio
              # blue/green layer, verifies counts, then commits the checkpoint.
              # It never writes the Camstar database.
              command: ["python", "scripts/graphstudio_sync.py", "continuous-publish", "--job", "camstar-full", "--profile", "opcenter2607-core", "--environment", "dev", "--apply", "--actor", "k8s-cronjob"]
              envFrom:
                - secretRef:
                    name: camstar-graphstudio-sync-secrets
                - configMapRef:
                    name: camstar-graphstudio-sync-config
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: camstar-graphstudio-sync-config
data:
  GRAPHSTUDIO_GRAPHMART_URI: "http://cambridgesemantics.com/Graphmart/ba6308d1b3764b8a8ad40d90500ddd56"
  GRAPHSTUDIO_FILE_CONNECTION: "http://cambridgesemantics.com/File_Connection/localShare"
  GRAPHSTUDIO_FILE_PATH: "Opcenter2607/CamstarSync"
  LOG_LEVEL: "INFO"

# Create the referenced Secret outside source control. It must provide at least:
# NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD,
# SRC_DB_TYPE, SRC_DB_HOST, SRC_DB_PORT, SRC_DB_NAME, SRC_DB_USER, SRC_DB_PASSWORD,
# SRC_DB_SCHEMA, SRC_DB_ORACLE_MODE,
# GRAPHSTUDIO_BASE_URL, GRAPHSTUDIO_USER, GRAPHSTUDIO_PASSWORD,
# SYNC_STATE_DATABASE_URL.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: camstar-graphstudio-health
spec:
  schedule: "*/15 * * * *"
  timeZone: "Asia/Shanghai"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: health
              image: registry.example.com/camstar-ontology:latest
              command: ["python", "scripts/graphstudio_sync.py", "health-check", "--profile", "opcenter2607-core"]
              envFrom:
                - secretRef:
                    name: camstar-graphstudio-sync-secrets
                - configMapRef:
                    name: camstar-graphstudio-sync-config
