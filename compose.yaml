name: camstar-ontology

x-app-environment: &app-environment
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?请先在 .env 中设置 NEO4J_PASSWORD}
  CHAT_LOG_DIR: /app/logs/chat
  CHAT_SESSION_DIR: /app/data/chat_sessions
  PYTHONUNBUFFERED: "1"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: camstar-ontology-app:${APP_IMAGE_TAG:-local}
  env_file:
    - .env
  environment:
    <<: *app-environment
  networks:
    - camstar

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请先在 .env 中设置 NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
    ports:
      - "${NEO4J_HTTP_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - camstar

  app-data-init:
    <<: *app-base
    restart: "no"
    command:
      [
        "python",
        "scripts/docker/init_app_data.py",
        "--data-source",
        "/seed/data",
        "--data-target",
        "/app/data",
        "--logs-source",
        "/seed/logs",
        "--logs-target",
        "/app/logs",
      ]
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./data:/seed/data:ro
      - ./logs:/seed/logs:ro

  ontology-init:
    <<: *app-base
    restart: "no"
    command: ["python", "src/ontology/loader/neo4j_loader.py"]
    volumes:
      - app_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully

  app:
    <<: *app-base
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-5050}:5050"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully
      ontology-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5050/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - camstar

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  app_data:
  app_logs:

networks:
  camstar:
    driver: bridge
